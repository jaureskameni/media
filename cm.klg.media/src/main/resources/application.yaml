---
server:
  port: 8085
  shutdown: "graceful"
spring:
  application:
    name: "madia"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI}"
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${APP_POSTGRES_PORT:5432}/${APP_DB_NAME:uam}"
    username: "${POSTGRES_ADMIN_USER:zlink}"
    password: "${POSTGRES_ADMIN_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: "varchar"
  liquibase:
    change-log: "classpath:cm/klg/map/repository/liquibase/changelog/master.xml"
    enabled: true
jk-dev:
  events-messaging:
    inbox:
      enabled: "${DOMAIN_EVENTS_MESSAGING_CONSUMER_ENABLED:false}"
      batchSize: "${SCHEDULER_EVENT_NOTIFICATION_BATCH_SIZE:1000}"
      frequency: "${SCHEDULER_EVENT_NOTIFICATION_FREQUENCY:5000}"
    outbox:
      enabled: "${DOMAIN_EVENTS_MESSAGING_PUBLISHER_ENABLED:false}"
      batchSize: "${SCHEDULER_EVENT_NOTIFICATION_BATCH_SIZE:1000}"
      frequency: "${SCHEDULER_EVENT_NOTIFICATION_FREQUENCY:5000}"
logging:
  level:
    root: "INFO"
    cm.klg.service_provider: "DEBUG"
    org.springframework.web: "INFO"
    org.springframework.security: "INFO"
    org.hibernate: "INFO"
    org.springframework.boot.autoconfigure.liquibase: "DEBUG"
    liquibase: "INFO"
    org.hibernate.tool.schema: "DEBUG"
